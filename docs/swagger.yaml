basePath: /
definitions:
  httputil.ErrorResponse:
    properties:
      error:
        type: string
      request_id:
        type: string
    type: object
  models.Appointment:
    properties:
      branch:
        description: Branch denotes the location or branch where the appointment takes
          place.
        type: string
      client_id:
        description: ClientID identifies the client associated with the appointment.
        type: string
      end_time:
        description: EndTime marks when the appointment is expected to finish.
        type: string
      id:
        description: ID is the unique identifier of the appointment.
        type: string
      notes:
        description: Notes contains optional remarks about the appointment.
        type: string
      provider_id:
        description: ProviderID identifies the service provider assigned to the appointment.
        type: string
      start_time:
        description: StartTime marks when the appointment begins.
        type: string
      status:
        description: Status represents the current status of the appointment (e.g.,
          scheduled, cancelled).
        type: string
    type: object
  models.Client:
    properties:
      address:
        description: Address is the client's mailing address.
        type: string
      email:
        description: Email is the client's preferred contact email.
        type: string
      id:
        description: ID is the unique client identifier.
        type: string
      name:
        description: Name is the client's full name.
        type: string
      phone:
        description: Phone is the client's contact phone number.
        type: string
    type: object
  models.CreateAppointmentRequest:
    properties:
      branch:
        description: Branch specifies where the appointment will happen.
        type: string
      client_id:
        description: ClientID identifies the client this appointment is for.
        type: string
      end_time:
        description: EndTime indicates when the appointment should end.
        type: string
      notes:
        description: Notes optionally contains additional information about the appointment.
        type: string
      provider_id:
        description: ProviderID identifies the provider fulfilling the appointment.
        type: string
      start_time:
        description: StartTime indicates when the appointment should begin.
        type: string
    type: object
  models.CreateClientRequest:
    properties:
      address:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  models.CreateProviderRequest:
    properties:
      address:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  models.Provider:
    properties:
      address:
        description: Address is the provider's business address.
        type: string
      email:
        description: Email is the provider's contact email.
        type: string
      id:
        description: ID is the unique provider identifier.
        type: string
      name:
        description: Name is the provider's display name.
        type: string
      phone:
        description: Phone is the provider's contact phone number.
        type: string
    type: object
  models.UpdateAppointmentRequest:
    properties:
      client_id:
        description: ClientID ensures only the owner can update status-related fields.
        type: string
      end_time:
        description: EndTime optionally updates when the appointment should end.
        type: string
      notes:
        description: Notes optionally updates additional information about the appointment.
        type: string
      start_time:
        description: StartTime optionally updates when the appointment should begin.
        type: string
      status:
        description: Status optionally updates the appointment status.
        type: string
    type: object
info:
  contact: {}
  description: API for managing appointments, availability, and health checks.
  title: Appointment Service API
  version: "1.0"
paths:
  /appointments:
    get:
      consumes:
      - application/json
      description: Returns appointments filtered by optional query parameters.
      parameters:
      - description: Filter by date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Filter by client identifier
        in: query
        name: client_id
        type: string
      - description: Filter by provider identifier
        in: query
        name: provider_id
        type: string
      - description: Filter by branch
        in: query
        name: branch
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Appointment'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List appointments
      tags:
      - appointments
    post:
      consumes:
      - application/json
      description: Creates a new appointment with the provided payload.
      parameters:
      - description: Appointment payload
        in: body
        name: appointment
        required: true
        schema:
          $ref: '#/definitions/models.CreateAppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Appointment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create appointment
      tags:
      - appointments
  /appointments/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a single appointment by its identifier.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Appointment'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get appointment by ID
      tags:
      - appointments
    put:
      consumes:
      - application/json
      description: Updates an existing appointment's time, notes, or status.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAppointmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Appointment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update appointment
      tags:
      - appointments
  /clients:
    get:
      consumes:
      - application/json
      description: Returns all clients.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Client'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List clients
      tags:
      - clients
    post:
      consumes:
      - application/json
      description: Creates a new client.
      parameters:
      - description: Client payload
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/models.CreateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Client'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create client
      tags:
      - clients
  /clients/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a single client by identifier.
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Client'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get client by ID
      tags:
      - clients
  /health:
    get:
      description: Returns 200 OK when the service process is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check service liveness
      tags:
      - health
  /providers:
    get:
      consumes:
      - application/json
      description: Returns all providers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Provider'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List providers
      tags:
      - providers
    post:
      consumes:
      - application/json
      description: Creates a new provider.
      parameters:
      - description: Provider payload
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/models.CreateProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Provider'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create provider
      tags:
      - providers
  /providers/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a single provider by identifier.
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Provider'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get provider by ID
      tags:
      - providers
  /ready:
    get:
      description: Returns 200 OK when dependencies (database) respond in time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Check service readiness
      tags:
      - health
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
